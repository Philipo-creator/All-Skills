<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Philip Chigozie">
  <meta name="description" content="Log in to your AllSkills account.">
  <title>AllSkills | Login</title>
  <link rel="icon" href="../img/Skills.png">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <a href="../index.html" class="brand">
      <img src="../img/Skills.png" alt="AllSkills logo">
      <span>AllSkills</span>
    </a>
    <a href="../skills.html" class="header-link">Explore Skills</a>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-sub">Log in to continue your learning.</p>

      <!-- JS LATER / BACK END LATER: check the email and password.
           For now any details open the dashboard. -->
      <form id="login-form" action="../learner/dashboard.html" method="get">

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required>
        </div>

        <div class="auth-options">
          <label class="check-line">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary full">Log In</button>
      </form>

      <!-- JS LATER / BACK END LATER: "Continue with Google" button goes here -->

      <p class="auth-switch">
        New to AllSkills? <a href="signup.html">Create a free account</a>
      </p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Copyright &copy; AllSkills. All Rights Reserved.</p>
  </footer>

</body>
</html>
